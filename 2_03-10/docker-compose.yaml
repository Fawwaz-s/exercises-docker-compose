services:
  frontend:
    build:
      context: ../example-app
      dockerfile: frontend/Dockerfile.frontend
    ports:
      - "5001:5001"

  backend:
    build:
      context: ../example-app
      dockerfile: backend/Dockerfile.backend
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    ports:
      - "8080:8080"

  redis:
    image: redis:alpine
